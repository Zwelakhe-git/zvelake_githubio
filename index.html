<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Forma Design</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; }
    .artboard { position: relative; width: min(100%, 1200px); height: 760px; margin: 0 auto; overflow: hidden; background: #fff; }
    #forma-ad69d17e-82bc-477e-a428-86b2c80beddf { width:170px; height:98px; background:#f8f6ff; border-radius:12px; border:0px solid #20222a; box-shadow:none; position:absolute; left:327px; top:199px; display:flex; gap:12px; padding:16px; flex-direction:row; align-items:flex-start; overflow:visible; }
    #start-btn { width:63px; height:66px; background:#0061e0; border-radius:100px; border:0px solid #20222a; box-shadow:none; flex:0 0 auto; }
    #stop-btn { width:63px; height:66px; background:#f00000; border-radius:100px; border:0px solid #20222a; box-shadow:none; flex:0 0 auto; }
  </style>
</head>
<body>
  <main id="artboard" class="artboard">
  <div id="forma-ad69d17e-82bc-477e-a428-86b2c80beddf" class="container" aria-label="Layout container">
    <div id="start-btn" class="circle" aria-label="Circle"></div>
    <div id="stop-btn" class="circle" aria-label="Circle"></div>
  </div>
  </main>
  <script src="./script.js" type="module"></script>
</body>
</html>
